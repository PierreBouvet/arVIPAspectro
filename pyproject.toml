[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arVIPAspectro"
version = "0.1.0"
description = "Angle-Resolved VIPA Brillouin Spectroscopy Calibration and Peak Fitting Package"
authors = [
    {name = "Pierre Bouvet"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arVIPAspectro*"]
